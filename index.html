<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kapehan POS</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#8a3b12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kapehan POS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6efe4;--card:#fffaf2;--ink:#2b1d14;--mut:#7a6656;--line:#e3d5c2;--pri:#8a3b12;--priink:#fff;--acc:#2f6b4f;--bad:#b3261e;--chip:#efe2cf}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1c1511;--card:#271d17;--ink:#f3e7d8;--mut:#b09c88;--line:#3d2f26;--pri:#e08a4f;--priink:#1c1511;--acc:#6cc39a;--bad:#ff8a80;--chip:#33271f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1c1511;--card:#271d17;--ink:#f3e7d8;--mut:#b09c88;--line:#3d2f26;--pri:#e08a4f;--priink:#1c1511;--acc:#6cc39a;--bad:#ff8a80;--chip:#33271f}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif;padding-bottom:84px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;min-height:44px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pri);outline-offset:1px}
button.pri{background:var(--pri);color:var(--priink);border-color:var(--pri);font-weight:700}
button.bad{color:var(--bad)}
button.sm{min-height:36px;padding:4px 10px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;width:100%}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--pri);color:var(--priink);padding:10px 14px;display:flex;align-items:center;gap:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pri);z-index:6}
header h1{font-size:20px;flex:1}
nav{display:flex;gap:6px}
nav button{background:transparent;color:var(--priink);border-color:transparent;font-weight:700}
nav button.on{background:var(--priink);color:var(--pri)}
main{max-width:1100px;margin:0 auto;padding:12px}
.grid{display:grid;gap:12px}
@media(min-width:800px){.pos{grid-template-columns:1fr 380px;align-items:start}.cart{position:sticky;top:70px}.bar{display:none!important}}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.cats button{white-space:nowrap;border-radius:99px}
.cats button.on{background:var(--ink);color:var(--bg)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}
.item{text-align:left;display:flex;flex-direction:column;justify-content:space-between;min-height:84px;padding:10px;background:var(--card)}
.item b{font-weight:600}.item span{color:var(--acc);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.row>.grow{flex:1;min-width:0}
.qty{display:flex;align-items:center;gap:4px}.qty button{width:36px;min-height:36px;padding:0}
.w80{width:84px}.w60{width:64px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chips button{background:var(--chip);border-radius:99px;min-height:36px;padding:4px 12px}
.pay{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pay button.on{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:700}
.tot{display:flex;justify-content:space-between;font-size:22px;font-weight:700;font-family:Georgia,serif;margin:8px 0}
.mut{color:var(--mut);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stat b{display:block;font-size:24px;font-family:Georgia,serif}
.bar{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:5}
.bar button{width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:9}
.hide{display:none!important}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<header><h1>Kapehan &amp; Luto POS</h1>
<nav><button id="t-pos" class="on" onclick="tab('pos')">Order</button><button id="t-inc" onclick="tab('inc')">Income</button><button id="t-menu" onclick="tab('menu')">Menu</button></nav></header>
<main>
<section id="v-pos" class="grid pos">
  <div><div class="cats" id="cats"></div><div class="items" id="items"></div></div>
  <div class="card cart" id="cart"></div>
</section>
<section id="v-inc" class="hide"></section>
<section id="v-menu" class="hide"></section>
</main>
<div class="bar" id="bar"><button class="pri" onclick="document.getElementById('cart').scrollIntoView({behavior:'smooth'})" id="barbtn"></button></div>
<div class="toast hide" id="toast"></div>
<script>
var KEY='kapehan-pos-v1';
var P=['Cash','GCash','Maya','Card'];
var S=load();
var cart=blank(),cat=S.cats[0],view='pos',range='today',editing=null;
function blank(){return{items:[],charges:[],disc:0,pay:'Cash',recv:'',type:'Dine-in',table:''}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function defaults(){
 var m=[['Kape','Brewed Coffee',60],['Kape','Barako',55],['Kape','Americano',70],['Kape','Cappuccino',90],['Kape','Iced Latte',100],
 ['Sugba','Sugba Baboy',120],['Sugba','Sugba Manok',110],['Sugba','Sugba Bangus',150],['Sugba','Sugba Pusit',180],
 ['Tula','Tinolang Manok',130],['Tula','Sinigang Baboy',140],['Tula','Tula Isda',130],
 ['Kilaw','Kilaw Tuna',160],['Kilaw','Kilaw Tanigue',170],['Kilaw','Kilaw Pusit',150],
 ['Prito','Prito Manok',110],['Prito','Prito Isda',100],['Prito','Lumpia',80],
 ['Kan-on','Plain Rice',20],['Kan-on','Garlic Rice',35],
 ['Ilimnon','Softdrink',35],['Ilimnon','Iced Tea',40],['Ilimnon','Buko Juice',50]];
 return{cats:['Kape','Sugba','Tula','Kilaw','Prito','Kan-on','Ilimnon'],
 menu:m.map(function(x){return{id:uid(),cat:x[0],name:x[1],price:x[2]}}),
 addons:[{id:uid(),name:'Extra rice',price:20},{id:uid(),name:'Takeout box',price:10},{id:uid(),name:'Extra shot',price:30},{id:uid(),name:'Service charge',price:20}],
 sales:[],n:0}}
function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&d.menu)return d}}catch(e){}return defaults()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function peso(n){return '₱'+(+n||0).toLocaleString('en-PH',{maximumFractionDigits:2})}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n}
function toast(t){var e=$('toast');e.textContent=t;e.classList.remove('hide');setTimeout(function(){e.classList.add('hide')},1800)}
function sub(c){return c.items.reduce(function(a,i){return a+i.price*i.qty},0)}
function total(c){return Math.max(0,sub(c)+c.charges.reduce(function(a,x){return a+x.amt},0)-c.disc)}
function tab(t){view=t;['pos','inc','menu'].forEach(function(k){$('v-'+k).classList.toggle('hide',k!==t);$('t-'+k).classList.toggle('on',k===t)});$('bar').classList.toggle('hide',t!=='pos');render()}
function render(){if(view==='pos')renderPos();else if(view==='inc')renderInc();else renderMenu()}

/* ORDER */
function renderPos(){
 if(S.cats.indexOf(cat)<0)cat=S.cats[0];
 $('cats').innerHTML=S.cats.map(function(c,i){return '<button class="'+(c===cat?'on':'')+'" onclick="setCat('+i+')">'+esc(c)+'</button>'}).join('');
 var list=S.menu.filter(function(m){return m.cat===cat});
 $('items').innerHTML=list.length?list.map(function(m){return '<button class="item" onclick="addItem(\''+m.id+'\')"><b>'+esc(m.name)+'</b><span>'+peso(m.price)+'</span></button>'}).join(''):'<p class="mut">No items here yet. Add some in the Menu tab.</p>';
 drawCart();
}
function setCat(i){cat=S.cats[i];renderPos()}
function addItem(id){var m=S.menu.find(function(x){return x.id===id});var l=cart.items.find(function(i){return i.mid===id&&i.price===m.price});
 if(l)l.qty++;else cart.items.push({mid:id,name:m.name,price:m.price,qty:1});drawCart()}
function drawCart(){
 var h='<h2>'+(editing?'Editing order #'+editing.no:'Current order')+'</h2>';
 h+='<div class="row"><select onchange="cart.type=this.value">'+['Dine-in','Takeout'].map(function(t){return '<option'+(cart.type===t?' selected':'')+'>'+t+'</option>'}).join('')+'</select><input placeholder="Table / name" value="'+esc(cart.table)+'" oninput="cart.table=this.value"></div>';
 if(!cart.items.length)h+='<p class="mut">Tap a menu item to add it.</p>';
 cart.items.forEach(function(i,k){h+='<div class="row"><div class="grow"><b>'+esc(i.name)+'</b></div><input class="w80" type="number" inputmode="decimal" value="'+i.price+'" onchange="cart.items['+k+'].price=num(this.value);drawCart()" aria-label="Price"><div class="qty"><button onclick="qty('+k+',-1)">−</button><b>'+i.qty+'</b><button onclick="qty('+k+',1)">+</button></div></div>'});
 h+='<h3 style="margin-top:12px;font-size:16px">Add-ons &amp; charges</h3><div class="chips">'+S.addons.map(function(a){return '<button onclick="addCharge(\''+a.id+'\')">+ '+esc(a.name)+' '+peso(a.price)+'</button>'}).join('')+'<button onclick="addCharge()">+ Other</button></div>';
 cart.charges.forEach(function(c,k){h+='<div class="row"><input class="grow" value="'+esc(c.name)+'" onchange="cart.charges['+k+'].name=this.value"><input class="w80" type="number" inputmode="decimal" value="'+c.amt+'" onchange="cart.charges['+k+'].amt=num(this.value);drawCart()"><button class="sm bad" onclick="cart.charges.splice('+k+',1);drawCart()">✕</button></div>'});
 h+='<div class="row"><span class="grow">Discount (₱)</span><input class="w80" type="number" inputmode="decimal" value="'+(cart.disc||'')+'" onchange="cart.disc=num(this.value);drawCart()"></div>';
 var t=total(cart);
 h+='<div class="tot"><span>Total</span><span>'+peso(t)+'</span></div>';
 h+='<div class="pay">'+P.map(function(p){return '<button class="'+(cart.pay===p?'on':'')+'" onclick="cart.pay=\''+p+'\';drawCart()">'+p+'</button>'}).join('')+'</div>';
 if(cart.pay==='Cash'){var ch=num(cart.recv)-t;h+='<div class="row"><span class="grow">Cash received</span><input class="w80" type="number" inputmode="decimal" value="'+esc(cart.recv)+'" oninput="cart.recv=this.value;chg()"></div><div class="row mut"><span class="grow">Change</span><b id="chg">'+(cart.recv===''?'—':(ch>=0?peso(ch):'Short '+peso(-ch)))+'</b></div>'}
 h+='<div class="row"><button class="pri grow" onclick="pay()" '+(cart.items.length?'':'disabled')+'>'+(editing?'Save changes':'Paid — save order')+'</button><button onclick="clearCart()">Clear</button></div>';
 $('cart').innerHTML=h;
 $('barbtn').textContent='View order · '+cart.items.reduce(function(a,i){return a+i.qty},0)+' items · '+peso(t);
}
function chg(){var ch=num(cart.recv)-total(cart);$('chg').textContent=cart.recv===''?'—':(ch>=0?peso(ch):'Short '+peso(-ch))}
function qty(k,d){cart.items[k].qty+=d;if(cart.items[k].qty<1)cart.items.splice(k,1);drawCart()}
function addCharge(id){var a=S.addons.find(function(x){return x.id===id});cart.charges.push(a?{name:a.name,amt:a.price}:{name:'Other charge',amt:0});drawCart()}
function clearCart(){cart=blank();editing=null;drawCart()}
function pay(){
 var rec={items:cart.items.map(function(i){return{name:i.name,price:i.price,qty:i.qty,cat:(S.menu.find(function(m){return m.id===i.mid})||{}).cat||''}}),charges:cart.charges.slice(),disc:cart.disc,total:total(cart),pay:cart.pay,recv:num(cart.recv),type:cart.type,table:cart.table};
 if(editing){var s=S.sales.find(function(x){return x.id===editing.id});rec.id=s.id;rec.no=s.no;rec.ts=s.ts;S.sales[S.sales.indexOf(s)]=rec;toast('Order #'+rec.no+' updated')}
 else{S.n++;rec.id=uid();rec.no=S.n;rec.ts=Date.now();S.sales.push(rec);toast('Order #'+rec.no+' saved · '+peso(rec.total))}
 save();cart=blank();editing=null;drawCart()}

/* INCOME */
function since(){var d=new Date();d.setHours(0,0,0,0);if(range==='today')return d.getTime();if(range==='week')return d.getTime()-6*864e5;if(range==='month'){d.setDate(1);return d.getTime()}return 0}
function renderInc(){
 var from=since(),L=S.sales.filter(function(s){return s.ts>=from}).sort(function(a,b){return b.ts-a.ts});
 var sum=L.reduce(function(a,s){return a+s.total},0),by={},cats={},top={};
 L.forEach(function(s){by[s.pay]=(by[s.pay]||0)+s.total;s.items.forEach(function(i){cats[i.cat||'Other']=(cats[i.cat||'Other']||0)+i.price*i.qty;top[i.name]=(top[i.name]||0)+i.qty})});
 var h='<div class="row"><select id="rg" onchange="range=this.value;renderInc()">'+[['today','Today'],['week','Last 7 days'],['month','This month'],['all','All time']].map(function(r){return '<option value="'+r[0]+'"'+(range===r[0]?' selected':'')+'>'+r[1]+'</option>'}).join('')+'</select><button onclick="copyCsv()">Copy as CSV</button></div>';
 h+='<div class="stats"><div class="card stat"><span class="mut">Income</span><b>'+peso(sum)+'</b></div><div class="card stat"><span class="mut">Orders</span><b>'+L.length+'</b></div><div class="card stat"><span class="mut">Average order</span><b>'+peso(L.length?sum/L.length:0)+'</b></div></div>';
 function list(o,m){var k=Object.keys(o).sort(function(a,b){return o[b]-o[a]}).slice(0,m||20);return k.length?k.map(function(x){return '<div class="row"><span class="grow">'+esc(x)+'</span><b>'+(m?o[x]+' sold':peso(o[x]))+'</b></div>'}).join(''):'<p class="mut">Nothing yet.</p>'}
 h+='<div class="stats" style="margin-top:8px"><div class="card"><h3>By payment</h3>'+list(by)+'</div><div class="card"><h3>By category</h3>'+list(cats)+'</div><div class="card"><h3>Best sellers</h3>'+list(top,5)+'</div></div>';
 h+='<div class="card" style="margin-top:8px"><h3>Orders</h3>'+(L.length?'<div class="scroll"><table>'+L.map(function(s){var d=new Date(s.ts);
  return '<tr><td><b>#'+s.no+'</b><div class="mut">'+d.toLocaleDateString('en-PH',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'})+'</div></td><td>'+s.items.map(function(i){return i.qty+'× '+esc(i.name)}).join(', ')+(s.charges.length?'<div class="mut">+ '+s.charges.map(function(c){return esc(c.name)+' '+peso(c.amt)}).join(', ')+'</div>':'')+(s.disc?'<div class="mut">Discount −'+peso(s.disc)+'</div>':'')+'<div class="mut">'+s.type+(s.table?' · '+esc(s.table):'')+'</div></td><td><b>'+peso(s.total)+'</b><br><select class="w80" onchange="setPay(\''+s.id+'\',this.value)">'+P.map(function(p){return '<option'+(s.pay===p?' selected':'')+'>'+p+'</option>'}).join('')+'</select></td><td><button class="sm" onclick="editSale(\''+s.id+'\')">Edit</button> <button class="sm bad" onclick="delSale(\''+s.id+'\',this)">Delete</button></td></tr>'}).join('')+'</table></div>':'<p class="mut">No orders in this period.</p>')+'</div>';
 $('v-inc').innerHTML=h}
function setPay(id,p){S.sales.find(function(s){return s.id===id}).pay=p;save();renderInc();toast('Payment changed to '+p)}
function editSale(id){var s=S.sales.find(function(x){return x.id===id});editing={id:id,no:s.no};
 cart={items:s.items.map(function(i){var m=S.menu.find(function(x){return x.name===i.name});return{mid:m?m.id:'',name:i.name,price:i.price,qty:i.qty}}),charges:s.charges.map(function(c){return{name:c.name,amt:c.amt}}),disc:s.disc,pay:s.pay,recv:s.recv||'',type:s.type,table:s.table||''};tab('pos')}
function delSale(id,b){if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='Sure?';setTimeout(function(){b.dataset.sure='';b.textContent='Delete'},2500);return}
 S.sales=S.sales.filter(function(s){return s.id!==id});save();renderInc()}
function copyCsv(){var from=since(),r=['Order,Date,Items,Charges,Discount,Total,Payment,Type,Table'];
 S.sales.filter(function(s){return s.ts>=from}).forEach(function(s){function q(x){return '"'+String(x).replace(/"/g,'""')+'"'}
 r.push([s.no,new Date(s.ts).toLocaleString('en-PH'),q(s.items.map(function(i){return i.qty+'x '+i.name}).join('; ')),q(s.charges.map(function(c){return c.name+' '+c.amt}).join('; ')),s.disc,s.total,s.pay,s.type,q(s.table||'')].join(','))});
 try{navigator.clipboard.writeText(r.join('\n')).then(function(){toast('CSV copied — paste into Excel or Sheets')},function(){toast('Copy blocked by browser')})}catch(e){toast('Copy blocked by browser')}}

/* MENU EDITOR */
function renderMenu(){
 var h='<div class="card"><h3>Add item</h3><div class="row"><input id="nn" placeholder="Item name"><input id="np" class="w80" type="number" inputmode="decimal" placeholder="₱"><select id="nc" class="w80" style="width:120px">'+S.cats.map(function(c){return '<option>'+esc(c)+'</option>'}).join('')+'</select><button class="pri" onclick="addMenu()">Add</button></div></div>';
 S.cats.forEach(function(c,ci){h+='<div class="card" style="margin-top:8px"><div class="row"><h3 class="grow">'+esc(c)+'</h3><button class="sm" onclick="renCat('+ci+')">Rename</button><button class="sm bad" onclick="delCat('+ci+',this)">Delete</button></div>';
  S.menu.forEach(function(m,mi){if(m.cat!==c)return;h+='<div class="row"><input class="grow" value="'+esc(m.name)+'" onchange="S.menu['+mi+'].name=this.value;save()"><input class="w80" type="number" inputmode="decimal" value="'+m.price+'" onchange="S.menu['+mi+'].price=num(this.value);save()"><select style="width:110px" onchange="S.menu['+mi+'].cat=this.value;save();renderMenu()">'+S.cats.map(function(x){return '<option'+(x===m.cat?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select><button class="sm bad" onclick="delMenu('+mi+',this)">✕</button></div>'});h+='</div>'});
 h+='<div class="card" style="margin-top:8px"><h3>Add category</h3><div class="row"><input id="ncat" placeholder="e.g. Panghimagas"><button onclick="addCat()">Add</button></div></div>';
 h+='<div class="card" style="margin-top:8px"><h3>Add-ons &amp; extra charges</h3>'+S.addons.map(function(a,k){return '<div class="row"><input class="grow" value="'+esc(a.name)+'" onchange="S.addons['+k+'].name=this.value;save()"><input class="w80" type="number" inputmode="decimal" value="'+a.price+'" onchange="S.addons['+k+'].price=num(this.value);save()"><button class="sm bad" onclick="S.addons.splice('+k+',1);save();renderMenu()">✕</button></div>'}).join('')+'<div class="row"><input id="an" placeholder="Add-on name"><input id="ap" class="w80" type="number" inputmode="decimal" placeholder="₱"><button onclick="addAddon()">Add</button></div></div>';
 h+='<p class="mut">Saved automatically on this device. Changes to prices only affect new orders.</p>';
 $('v-menu').innerHTML=h}
function addMenu(){var n=$('nn').value.trim();if(!n)return toast('Enter an item name');S.menu.push({id:uid(),name:n,price:num($('np').value),cat:$('nc').value});save();renderMenu();toast('Added '+n)}
function delMenu(i,b){if(b.dataset.s!=='1'){b.dataset.s='1';b.textContent='Sure?';setTimeout(function(){b.dataset.s='';b.textContent='✕'},2500);return}S.menu.splice(i,1);save();renderMenu()}
function addCat(){var n=$('ncat').value.trim();if(n&&S.cats.indexOf(n)<0){S.cats.push(n);save();renderMenu()}}
function renCat(i){var n=prompt('Rename category',S.cats[i]);if(!n||!n.trim())return;n=n.trim();var o=S.cats[i];S.menu.forEach(function(m){if(m.cat===o)m.cat=n});S.cats[i]=n;if(cat===o)cat=n;save();renderMenu()}
function delCat(i,b){if(b.dataset.s!=='1'){b.dataset.s='1';b.textContent='Sure?';setTimeout(function(){b.dataset.s='';b.textContent='Delete'},2500);return}var o=S.cats[i];S.cats.splice(i,1);S.menu=S.menu.filter(function(m){return m.cat!==o});save();renderMenu()}
function addAddon(){var n=$('an').value.trim();if(!n)return;S.addons.push({id:uid(),name:n,price:num($('ap').value)});save();renderMenu()}
render();
